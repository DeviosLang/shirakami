# Shirakami 配置示例
# 复制为 shirakami.yaml 并填写实际配置值
# 所有 llm/db/redis 字段均可通过环境变量覆盖（见下方说明）

# 工作空间目录 — 所有 repo 将被 clone/pull 到此目录下（平铺）
workspace: /tmp/shirakami-workspace

# LLM 配置
# 支持 OpenAI 兼容接口（OpenAI / Azure OpenAI / Qwen / 本地 vLLM 等）
# 环境变量覆盖：
#   SHIRAKAMI_LLM_API_KEY   — API Key
#   SHIRAKAMI_LLM_ENDPOINT  — API 基础地址
#   SHIRAKAMI_LLM_MODEL     — 模型名称
llm:
  endpoint: https://api.openai.com/v1    # API 基础地址，末尾不带斜杠
  api_key: ""                             # 必填（或通过环境变量 SHIRAKAMI_LLM_API_KEY 设置）
  model: gpt-4o                           # 模型名称
  max_tokens: 128000                      # 最大 token 数，影响上下文压缩策略触发时机

# PostgreSQL 连接字符串
# 环境变量覆盖：SHIRAKAMI_DB_DSN
db:
  dsn: postgres://shirakami:shirakami@localhost:5432/shirakami?sslmode=disable

# Redis 连接地址（host:port）
# 环境变量覆盖：SHIRAKAMI_REDIS_ADDR
redis:
  addr: localhost:6379

# 需要分析的代码仓库列表
# 所有仓库将被 clone/pull 到 workspace 目录下，以 name 作为子目录名
repos:
  - name: api-gateway                          # 仓库短名（作为工作空间子目录名）
    url: git@github.com:org/api-gateway.git    # 支持 SSH 和 HTTPS 格式
    branch: main                               # 分支名，每次分析前自动 pull
    role: entry                                # entry: 标记为业务对外入口仓库
                                               # 集成测试入口从此仓库的路由注册函数识别
  - name: payment-service
    url: git@github.com:org/payment-service.git
    branch: main
    # role 字段省略时默认为普通服务仓库

  - name: order-service
    url: git@github.com:org/order-service.git
    branch: main

# 本次变更列表（支持多仓库同时变更）
changes:
  - repo: payment-service                      # 仓库名（对应 repos[].name）
    diff: ./diffs/payment.patch                # unified diff 文件路径（相对于配置文件）
    desc: 修改支付超时重试逻辑                  # 变更描述（辅助 LLM 理解变更意图）

  - repo: order-service
    diff: ./diffs/order.patch
    desc: 更新订单状态接口

# ──────────────────────────────────────────────────────────────
# 多 patch 联合分析（--analysis 标志所使用的独立 YAML 格式）
# 注意：以下为独立 analysis config 文件的格式示例，
#       与上面的 shirakami.yaml 主配置文件是两个不同的文件。
#       使用方式：shirakami analyze --analysis ./my-analysis.yaml --config shirakami.yaml
# ──────────────────────────────────────────────────────────────
#
# source_repo: payment-service
# description: "MR-1234 + MR-1235 联合影响分析"
#
# # extra_prompt：注入到 e2e/UT 场景生成 prompt 的业务上下文（可选）
# # 适合沉淀无法从代码推断的领域知识，例如加密规范、外部系统 SLA、测试框架要求
# extra_prompt: |
#   该服务通过 SM4 国密算法加密磁盘，密钥由 KMS 服务下发。
#   e2e 场景必须覆盖：KMS 不可达时的降级路径、加密设备挂载后 /dev/vd* 状态验证。
#   UT mock 需模拟 libvirt.open() 和 kms.GetKey() 两个外部调用。
#
# patches:
#   - path: ./diffs/mr1234.patch
#     description: "修复支付超时重试逻辑"
#   - path: ./diffs/mr1235.patch
#     description: "更新订单状态接口"
#
# scope:
#   only_cross_repos: [order-service, api-gateway]  # 只分析这些仓库的跨仓调用

# Prometheus Pushgateway 配置（可选）
# 适合部署在内网、无法被 Prometheus 主动 scrape 时使用
# 环境变量覆盖：
#   SHIRAKAMI_METRICS_PUSHGATEWAY_URL — Pushgateway 地址
#   SHIRAKAMI_METRICS_PUSH_INTERVAL   — 后台推送间隔（秒），0 = 仅在任务完成时推送
#   SHIRAKAMI_METRICS_JOB_NAME        — Prometheus job 标签名称
metrics:
  pushgateway_url: "http://21.215.89.245:8080"  # Pushgateway 地址（留空则禁用）
  push_interval_seconds: 30                      # 后台定期推送间隔，默认 30s
  job_name: shirakami                            # Prometheus job 标签
